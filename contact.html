<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담문의 | 선심 비즈 파트너스</title>
  <meta name="description" content="선심 비즈 파트너스 상담문의. 기업인증, R&D 지원사업, 정책자금, 절세전략 상담.">
  <meta name="theme-color" content="#082133">
  <link rel="stylesheet" href="assets/style.css">
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init','1262157532145864');fbq('track','PageView');
  </script>
</head>
<body class="contact-page">
<header class="site-header solid">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img src="assets/ssbp_logo_exact.png" alt="SSBP 선심 BIZ PARTNERS">
    </a>
    <nav class="desktop-nav">
      <a href="index.html#philosophy">ABOUT</a>
      <a href="index.html#business">BUSINESS</a>
      <a href="index.html#founder">FOUNDER</a>
      <a href="index.html#insight">INSIGHT</a>
      <a class="nav-contact" href="contact.html">CONTACT</a>
    </nav>
  </div>
</header>

<main class="contact-main">
  <div class="contact-page-wrap">
    <div class="contact-intro">
      <p class="eyebrow">CONTACT SSBP</p>
      <h1>기업의 현재를 분석해<br>필요한 제도와 준비를 함께 검토합니다.</h1>
      <p>
        기업인증 · R&amp;D 지원사업 · 정책자금 · 절세전략 상담을 위한
        기본 정보를 남겨주세요.
      </p>
      <div class="contact-brand-panel">
        <img src="assets/ssbp_logo_exact.png" alt="SSBP 선심 BIZ PARTNERS">
      </div>
    </div>

    <div class="contact-form-box">
      <p class="eyebrow">CONSULTATION FORM</p>
      <h2>상담 신청</h2>

      <form id="consultForm">
        <div class="form-grid">
          <label>
            <span>대표자 성함</span>
            <input type="text" name="name" placeholder="성함" required>
          </label>
          <label>
            <span>연락처</span>
            <input type="tel" name="tel" placeholder="010-0000-0000" required>
          </label>
          <label class="full">
            <span>사업자 유형</span>
            <select name="type">
              <option value="법인사업자">법인사업자</option>
              <option value="개인사업자">개인사업자</option>
            </select>
          </label>
          <label class="full">
            <span>주요 업종</span>
            <input type="text" name="industry" placeholder="예) 제조업, 서비스업, 디자인업" required>
          </label>
          <label class="full">
            <span>사업 업력</span>
            <select name="history" required>
              <option value="" disabled selected>업력을 선택해주세요</option>
              <option value="3년 미만">3년 미만</option>
              <option value="3년 이상 7년 미만">3년 이상 7년 미만</option>
              <option value="7년 이상">7년 이상</option>
            </select>
          </label>
          <label class="full">
            <span>연 매출</span>
            <select name="revenue" required>
              <option value="" disabled selected>매출 규모를 선택해주세요</option>
              <option value="1억 미만">1억 미만</option>
              <option value="1억 이상 ~ 10억 미만">1억 이상 ~ 10억 미만</option>
              <option value="10억 이상 ~ 30억 미만">10억 이상 ~ 30억 미만</option>
              <option value="30억 이상 ~ 50억 미만">30억 이상 ~ 50억 미만</option>
              <option value="50억 이상 ~ 100억 미만">50억 이상 ~ 100억 미만</option>
              <option value="100억 이상">100억 이상</option>
            </select>
          </label>
          <div class="full">
            <button class="form-submit" type="submit">상담 신청하기</button>
            <p class="form-note">정책자금에는 정부·공공기관의 융자 또는 보증 등 금융지원 제도가 포함될 수 있습니다.</p>
          </div>
        </div>
      </form>
    </div>
  </div>
</main>

<script>
const scriptURL='https://script.google.com/macros/s/AKfycbzZJj8554b7QfYcO_shimNL2cNEmHlWRLm7Kz2-Z1P58t3kyvRBcKZxY8wv96pTGQDE/exec';
const form=document.getElementById('consultForm');
const telInput=form.querySelector('input[name="tel"]');

telInput.addEventListener('input',function(e){
  let val=e.target.value.replace(/[^0-9]/g,'');
  let f='';
  if(val.substring(0,2)==='02'){
    if(val.length<3) f=val;
    else if(val.length<6) f=val.substring(0,2)+'-'+val.substring(2);
    else if(val.length<10) f=val.substring(0,2)+'-'+val.substring(2,5)+'-'+val.substring(5);
    else f=val.substring(0,2)+'-'+val.substring(2,6)+'-'+val.substring(6,10);
  } else {
    if(val.length<4) f=val;
    else if(val.length<7) f=val.substring(0,3)+'-'+val.substring(3);
    else if(val.length<11) f=val.substring(0,3)+'-'+val.substring(3,6)+'-'+val.substring(6);
    else f=val.substring(0,3)+'-'+val.substring(3,7)+'-'+val.substring(7,11);
  }
  e.target.value=f;
});

form.addEventListener('submit',e=>{
  e.preventDefault();
  const name=form.querySelector('[name="name"]').value.trim();
  const tel=form.querySelector('[name="tel"]').value.trim();
  const industry=form.querySelector('[name="industry"]').value.trim();
  const history=form.querySelector('[name="history"]').value;
  const revenue=form.querySelector('[name="revenue"]').value;

  if(!/^[가-힣a-zA-Z\s]{2,}$/.test(name)){ alert('대표자 성함을 올바르게 입력해주세요.'); return; }
  if(!/^(01[016789]|02|0[3-9][0-9])-\d{3,4}-\d{4}$/.test(tel)){ alert('연락처를 올바른 형식으로 입력해주세요.'); return; }
  if(!industry){ alert('주요 업종을 입력해주세요.'); return; }
  if(!history){ alert('사업 업력을 선택해주세요.'); return; }
  if(!revenue){ alert('연 매출 규모를 선택해주세요.'); return; }

  if(!confirm('정책자금에는 정부·공공기관의 융자 또는 보증 등 금융지원 제도가 포함될 수 있습니다. 해당 내용을 확인하셨습니까?')) return;

  const btn=form.querySelector('button[type="submit"]');
  btn.disabled=true;
  btn.textContent='전송 중...';

  fetch(scriptURL,{method:'POST',body:new FormData(form)})
    .then(()=>{
      if(typeof fbq==='function') fbq('track','CompleteRegistration');
      alert('상담 신청이 완료되었습니다. 확인 후 연락드리겠습니다.');
      form.reset();
      btn.disabled=false;
      btn.textContent='상담 신청하기';
    })
    .catch(()=>{
      alert('오류가 발생했습니다. 다시 시도해주세요.');
      btn.disabled=false;
      btn.textContent='상담 신청하기';
    });
});
</script>
</body>
</html>
